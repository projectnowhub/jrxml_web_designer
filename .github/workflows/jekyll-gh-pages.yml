name: Deploy to GitHub Pages

on:
  # Deploy when changes are pushed to the main branch
  push:
    branches: [ master ]
  
  # Allow running the workflow manually
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out the code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: false
      
      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      # Set up pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4
      
      # Install dependencies
      - name: Install dependencies
        run: pnpm install
      
      # Build the project
      - name: Build project
        run: npm run build
      
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Optional: set a custom domain
          # cname: example.com
