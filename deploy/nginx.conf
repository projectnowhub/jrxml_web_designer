# Served by nginxinc/nginx-unprivileged (worker + master both run as uid 101).
# Dropped into /etc/nginx/conf.d/default.conf; the image's main nginx.conf keeps
# `pid /tmp/nginx.pid;` and the events/http blocks.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Compression (pod-level; ingress-controller may also gzip) ────────────
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # ── Health endpoint for k8s probes ─────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Never cache the SPA entrypoint — avoids stale app after a deploy ────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ── Content-hashed build assets — safe to cache hard ───────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|wasm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback — no client router today, but keeps deep links working ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Baseline security headers (no strict CSP — app uses inline styles) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
