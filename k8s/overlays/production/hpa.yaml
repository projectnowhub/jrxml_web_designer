apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: projectnowcdp-report-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: projectnowcdp-report-studio
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
